# Deploys DISH's Supabase Edge Functions whenever they change on main
# (or on demand from the Actions tab).
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project's reference id (Supabase → Project Settings → General)
# Optional, to enable AI features, also set as Edge Function secrets in Supabase
# (see AI_INTEGRATIONS.md) — they are not needed for the functions to run.
name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets (Settings → Secrets and variables → Actions), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        shell: bash
        run: |
          set +e
          supabase functions deploy --remote "$SUPABASE_PROJECT_REF" --yes 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # surface the cause as an annotation (visible on the run summary)
            msg=$(tail -n 20 deploy.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Supabase functions deploy failed::$msg"
          fi
          exit $status
