<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F3EEE6" />
    <script>
      // Pre-paint theme resolution (prevents a flash of the wrong theme).
      // Keep in sync with src/theme/theme.ts.
      ;(function () {
        var pref = 'system'
        try {
          var v = localStorage.getItem('dish-theme')
          if (v === 'light' || v === 'dark' || v === 'system') pref = v
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
        root.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#141412' : '#F3EEE6')
      })()
    </script>
    <meta name="description" content="DISH — good food, less thinking. Plan meals, track what you eat, and decide what to cook." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>DISH</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DISH needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
